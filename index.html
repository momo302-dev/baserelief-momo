<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELIEF — Gambar → Heightmap CNC (Otomatis)</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" fill="none" stroke="%23F0A33A" stroke-width="2"/><path d="M6 24c4-2 6-14 10-14s6 12 10 14" fill="none" stroke="%23F0A33A" stroke-width="2"/></svg>'>
<style>
  :root{--bg:#0D0E0B;--line:rgba(234,231,220,.09);--line2:rgba(234,231,220,.22);
    --ink:#EBE8DE;--dim:#8E8A7C;--amber:#F0A33A;--err:#E5484D;
    --mono:'IBM Plex Mono',ui-monospace,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
  ::selection{background:var(--amber);color:#141310}
  button{font-family:inherit}
  header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:57px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:13px}
  .brand svg{width:20px;height:20px}
  .brand h1{font-size:14px;font-weight:700;letter-spacing:.2em}
  .brand span{font:500 9.5px var(--mono);color:var(--dim);letter-spacing:.12em;padding-left:13px;border-left:1px solid var(--line)}
  .chip{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--dim);border:1px solid var(--line);padding:7px 11px}
  main{flex:1;display:grid;place-items:center;padding:22px 20px}
  #col{width:min(960px,100%);display:flex;flex-direction:column;gap:12px}
  #frame{position:relative;border:1px solid var(--line);min-height:min(420px,54vh);display:flex;align-items:center;justify-content:center;padding:16px;transition:border-color .15s}
  #frame.hot{border-color:var(--amber)}
  #empty{cursor:pointer;text-align:center;padding:24px}
  #empty h2{font-size:clamp(30px,4.4vw,52px);font-weight:700;line-height:1.05;text-transform:uppercase}
  #empty em{font-style:normal;color:transparent;-webkit-text-stroke:1.4px var(--amber)}
  #empty p{font:400 10.5px/1.9 var(--mono);color:var(--dim);letter-spacing:.1em;margin-top:14px}
  #out{display:none;max-width:100%;max-height:min(58vh,740px);cursor:pointer;outline:1px solid var(--line)}
  #actions{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:44px;flex-wrap:wrap}
  #meta{font:400 9.5px var(--mono);color:var(--dim);letter-spacing:.08em;line-height:1.7}
  #meta b{color:var(--ink);font-weight:500}
  #dlbar{display:flex;gap:8px}
  .dl{display:flex;align-items:center;gap:8px;padding:11px 15px;border:1px solid var(--line2);background:none;color:var(--ink);font:600 10px var(--mono);letter-spacing:.14em;cursor:pointer;transition:.15s}
  .dl:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  .dl:disabled{opacity:.3;cursor:not-allowed}
  .dl.pri{border-color:var(--amber);color:var(--amber)}
  #toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{background:#151612;border:1px solid var(--line2);border-left:2px solid var(--amber);padding:11px 15px;font:500 11px var(--mono);animation:tin .2s ease}
  .toast.err{border-left-color:var(--err)}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}}
  @media(max-width:680px){.brand span{display:none}#actions{flex-direction:column;align-items:stretch}#dlbar .dl{flex:1;justify-content:center}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 22 22" fill="none"><rect x="1.5" y="1.5" width="19" height="19" stroke="#F0A33A" stroke-width="1.5"/><path d="M4 16c3-1.5 4.5-9 7-9s4 7.5 7 9" stroke="#F0A33A" stroke-width="1.4"/></svg>
    <h1>RELIEF</h1><span>OTOMATIS · TANPA SERVER · ENGINE & APP TERPISAH</span>
  </div>
  <div class="chip" id="chip">SIAP</div>
</header>
<main><div id="col">
  <div id="frame">
    <div id="empty">
      <h2>JATUHKAN<br><em>GAMBAR</em>&nbsp;DI SINI</h2>
      <p>KLIK · SERET &amp; LEPAS · TEMPEL CTRL+V<br>TANPA PENGATURAN — SEMUA DIHITUNG OTOMATIS · PNG 16-BIT SIAP ASPIRE</p>
    </div>
    <canvas id="out" title="Klik untuk mengganti gambar"></canvas>
  </div>
  <div id="actions">
    <div id="meta">Klik / jatuhkan berkas untuk memuat gambar</div>
    <div id="dlbar">
      <button class="dl pri" id="dl16" disabled>UNDUH PNG 16-BIT</button>
      <button class="dl" id="dl8" disabled>PNG 8-BIT</button>
    </div>
  </div>
</div></main>
<div id="toasts"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
<script type="module" src="./app.js"></script>
</body>
</html>
